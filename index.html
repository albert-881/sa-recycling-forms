<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SA Recycling Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #233F8C;
    --navy-deep: #1A2F6B;
    --red: #E3174A;
    --bg: #F3F5FA;
    --surface: #FFFFFF;
    --ink: #1A2F6B;
    --muted: #5A6785;
    --line: #D5DBEA;
    --on-navy: #FFFFFF;
    --focus: #E3174A;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10193A;
      --surface: #1A2652;
      --ink: #FFFFFF;
      --muted: #B4BED8;
      --line: #2E3C70;
      --focus: #FF5A80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10193A;
    --surface: #1A2652;
    --ink: #FFFFFF;
    --muted: #B4BED8;
    --line: #2E3C70;
    --focus: #FF5A80;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }
  .logo-bar {
    background: #FFFFFF;
    border-bottom: 1px solid #D5DBEA;
    padding: 0.9rem 1.25rem;
  }
  .logo-bar img {
    display: block;
    height: 52px;
    width: auto;
    max-width: 100%;
  }
  header {
    background: var(--navy);
    color: var(--on-navy);
    padding: 3rem 1.25rem 2.75rem;
  }
  .wrap { max-width: 40rem; margin: 0 auto; }
  h1 {
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 2.75rem);
    line-height: 1.1;
    text-transform: uppercase;
    margin: 0;
  }
  .rule {
    width: 7rem;
    height: 4px;
    background: rgba(255,255,255,0.55);
    margin: 1.1rem 0 1rem;
  }
  .intro { margin: 0; color: rgba(255,255,255,0.88); }
  main { padding: 2rem 1.25rem 3rem; }
  .forms {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.875rem;
  }
  .form-link {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 5rem;
    padding: 1.125rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    text-decoration: none;
  }
  .form-link:hover { border-color: var(--navy); }
  .form-link:active { transform: translateY(1px); }
  .form-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .form-text { flex: 1; min-width: 0; }
  .form-name { display: block; font-weight: 600; font-size: 1.2rem; line-height: 1.25; }
  .form-desc { display: block; color: var(--muted); font-size: 0.95rem; margin-top: 0.2rem; }
  .open {
    flex: none;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.6rem 1.1rem;
    border: 1.5px solid var(--navy);
    border-radius: 999px;
    color: var(--navy);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .open { border-color: #FFFFFF; color: #FFFFFF; }
  }
  :root[data-theme="dark"] .open { border-color: #FFFFFF; color: #FFFFFF; }
  .form-link:hover .open { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  .empty { padding: 1.25rem; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.875rem; }
  @media (max-width: 420px) { .open { display: none; } }
</style>
</head>
<body>
<div class="logo-bar">
  <div class="wrap">
    <!-- Put your logo file next to index.html and set its name here -->
    <img src="logo.png" alt="SA Recycling" onerror="this.closest('.logo-bar').hidden = true">
  </div>
</div>
<header>
  <div class="wrap">
    <h1>Employee Forms</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="intro">Pick the form you need to fill out.</p>
  </div>
</header>
<main>
  <div class="wrap">
    <ul class="forms" id="forms"></ul>
    <footer>Questions about a form? Contact your supervisor.</footer>
  </div>
</main>

<script>
  // ── Add new forms here. Each entry becomes a button. ──
  const FORMS = [
    {
      name: "End-of-Day Checklist",
      description: "Demo Tech daily wrap-up checklist with signature.",
      url: "end-of-day.html"
    }
    // ,{ name: "Next Form", description: "What it's for.", url: "https://..." }
  ];

  const list = document.getElementById("forms");
  if (!FORMS.length) {
    list.innerHTML = '<li class="empty">No forms yet.</li>';
  } else {
    FORMS.forEach(f => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "form-link";
      a.href = f.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML =
        '<span class="form-text"><span class="form-name"></span><span class="form-desc"></span></span>' +
        '<span class="open" aria-hidden="true">Open form</span>';
      a.querySelector(".form-name").textContent = f.name;
      a.querySelector(".form-desc").textContent = f.description || "";
      li.appendChild(a);
      list.appendChild(li);
    });
  }
</script>
</body>
</html>
